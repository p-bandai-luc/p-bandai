<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プレバン商品一覧（上位10件）</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f4f6f8; color: #333; }
        h1 { font-size: 1.5em; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        .item { background: #fff; padding: 16px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
        .item a { font-weight: bold; text-decoration: none; color: #0066cc; font-size: 1.05em; display: block; margin-bottom: 6px; }
        .item a:hover { text-decoration: underline; }
        .price { font-weight: bold; color: #d9534f; font-size: 0.95em; margin-right: 15px; }
        .date { color: #777; font-size: 0.85em; }
    </style>
    <!-- 従来の検索エンジンのインデックス・追跡を拒否 -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- AIクローラー（ChatGPTやClaudeなど）の学習利用を拒否 -->
    <meta name="robots" content="noai, odncpa">
</head>
<body>
    <h1>プレバンデータ一覧（最新10件）</h1>
    <div id="list">読み込み中...</div>

    <script>
        // キャッシュ対策としてクエリに現在時刻を付与して最新のJSONを取得
        fetch('./data/data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const listDiv = document.getElementById('list');
                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<p>データがありません。</p>';
                    return;
                }
                let html = '';
                data.forEach((item, index) => {
                    html += `
                        <div class="item">
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${index + 1}. ${item.title}</a>
                            <div>
                                ${item.price ? `<span class="price">${item.price}</span>` : ''}
                                <span class="date">取得日時: ${item.date}</span>
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('list').innerHTML = '<p>データの読み込みに失敗しました。</p>';
            });
    </script>
</body>
</html>
